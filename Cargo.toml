[package]
name = "algox-phase-zero"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
pz-g1-diagnostics = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
sha2 = "0.10"
num-bigint = "0.4"
cardano-crypto = { version = "=1.0.5", default-features = false, features = ["std", "vrf", "kes"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
